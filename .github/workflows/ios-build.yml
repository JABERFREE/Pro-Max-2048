name: Build and Deploy to iOS App Store

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Sync iOS with Direct Path
        run: |
          node node_modules/@capacitor/cli/bin/capacitor add ios || true
          node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: Build iOS App
        run: |
          cd ios
          # استخدام المسار المباشر للـ workspace والتوقيع التلقائي
          xcodebuild -workspace App/App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     archive \
                     -archivePath $PWD/App/build/App.xcarchive \
                     -allowProvisioningUpdates \
                     DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
                     -archivePath App/build/App.xcarchive \
                     -exportPath App/build/output \
                     -exportOptionsPlist App/exportOptions.plist || true

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/output/App.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
