name: Build and Deploy to iOS App Store

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Grant Execute Permissions to Binaries
        run: chmod +x ./node_modules/.bin/* || true

      - name: Run Capacitor Sync
        run: npx cap sync ios

      - name: Clean Swift Package Cache and Fix Versions
        run: |
          cd ios/App
          # تنظيف أي قفل قديم للتبعيات يسبب مشكلة الإصدار 5.7.8
          rm -rf App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/Developer/Xcode/DerivedData
          
          # إزالة القيود الصارمة لإصدارات التبعيات من ملف المشروع الداخلي
          find . -name "project.pbxproj" -exec sed -i '' '/dependencyRule/d' {} + || true

      - name: Force Automatic Signing in Project
        run: |
          PROJECT_FILE=$(find . -name "*.pbxproj" -print -quit)
          if [ -f "$PROJECT_FILE" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' "$PROJECT_FILE" || true
            sed -i '' 's/DevelopmentTeam = "[^"]*";/DevelopmentTeam = "LH6K854ZP6";/g' "$PROJECT_FILE" || true
          fi

      - name: Build and Archive
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          
          xcodebuild -workspace $(basename "$WORKSPACE_PATH") \
                     -scheme App \
                     -configuration Release \
                     archive \
                     -archivePath $PWD/build/App.xcarchive \
                     -allowProvisioningUpdates \
                     -allowProvisioningDeviceRegistration \
                     DEVELOPMENT_TEAM="LH6K854ZP6" \
                     CODE_SIGN_STYLE=Automatic

      - name: Create exportOptions.plist Automatically
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>LH6K854ZP6</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/App.xcarchive \
                     -exportPath $PWD/build/output \
                     -exportOptionsPlist exportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/output/App.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
