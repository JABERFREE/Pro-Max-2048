name: Build and Deploy to App Store

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Grant Execute Permissions to Binaries
        run: chmod +x ./node_modules/.bin/*

      - name: Run Capacitor Sync
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Find and Build iOS App
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          echo "Found workspace: $WORKSPACE_PATH"
          
          # استخراج مجلد العمل بناءً على مكان الوجود الفعلي
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          
          xcodebuild -workspace $(basename "$WORKSPACE_PATH") -scheme App -configuration Release archive -archivePath $PWD/build/App.xcarchive -allowProvisioningUpdates

      - name: Export IPA
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          
          xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive -exportPath $PWD/build/output -automaticSigningStyle automatic || true

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/output/App.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
