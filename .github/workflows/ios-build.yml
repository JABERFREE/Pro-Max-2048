name: Build and Deploy to App Store

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Capacitor Sync
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS App
        run: |
          # الانتقال لمجلد ios
          cd ios/App
          
          # بناء التطبيق مع توجيه Xcode لاستخدام التوقيع التلقائي المرتبط بحسابك
          # هذه الخطوة تستخدم معلومات الـ Team ID الذي أضفناه سابقاً
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     archive \
                     -archivePath $PWD/build/App.xcarchive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                     -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                     -authenticationKeyPath "" \
                     DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/App.xcarchive \
                     -exportPath $PWD/build/output \
                     -exportOptionsPlist exportOptions.plist || true

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/output/App.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
