name: Build and Deploy to iOS App Store

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      # هذه الخطوة هي المفتاح: إجبار كل حزم الكاباسيتور على التحديث لآخر إصدار
      - name: Force Update Capacitor Packages
        run: |
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --save-exact

      - name: Sync iOS
        run: |
          node node_modules/@capacitor/cli/bin/capacitor add ios || true
          node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: Build and Resolve Dependencies
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          
          # مسح كامل لملفات القفل القديمة التي تسبب التعارض
          rm -rf ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          
          # محاولة البناء مع تجاوز فحص إصدارات التبعيات الجامدة
          xcodebuild -resolvePackageDependencies -workspace $(basename "$WORKSPACE_PATH") -scheme App -allowProvisioningUpdates -destination 'generic/platform=iOS'
          
          xcodebuild -workspace $(basename "$WORKSPACE_PATH") \
                     -scheme App \
                     -configuration Release \
                     archive \
                     -archivePath $PWD/build/App.xcarchive \
                     -allowProvisioningUpdates \
                     DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export IPA
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive -exportPath $PWD/build/output -exportOptionsPlist exportOptions.plist || true

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/output/App.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
