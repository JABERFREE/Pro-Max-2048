name: Build and Deploy to iOS App Store

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Force Update Capacitor Packages
        run: |
          npm i @capacitor/core@latest @capacitor/cli@latest @capacitor/ios@latest --save-exact

      - name: Sync iOS
        run: |
          node node_modules/@capacitor/cli/bin/capacitor add ios || true
          node node_modules/@capacitor/cli/bin/capacitor sync ios

      - name: Build and Archive with API Authentication
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          
          # إنشاء مفتاح خاص مؤقت من السر الموجود لكي يقرأه xcodebuild
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          mkdir -p ~/.private_keys
          cp AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 ~/.private_keys/
          
          # مسح القفل القديم
          rm -rf ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          
          # الأرشيف مع تمرير مفتاح المصادقة لتجاوز خطأ "No Accounts"
          xcodebuild -workspace $(basename "$WORKSPACE_PATH") \
                     -scheme App \
                     -configuration Release \
                     archive \
                     -archivePath $PWD/build/App.xcarchive \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
                     -authenticationKeyIssuerID "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
                     -authenticationKeyPath "$HOME/.private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8" \
                     DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}"

      - name: Export IPA
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          WORK_DIR=$(dirname "$WORKSPACE_PATH")
          cd "$WORK_DIR"
          
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/App.xcarchive \
                     -exportPath $PWD/build/output \
                     -exportOptionsPlist exportOptions.plist || true

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/output/App.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
