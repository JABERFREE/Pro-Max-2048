name: Build and Deploy to iOS App Store

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Run Capacitor Sync
        run: npx cap sync ios

      - name: Nuke Package Dependencies (The Solution)
        run: |
          cd ios/App
          # 1. حذف جميع ملفات القفل التي تفرض إصدارات قديمة
          find . -name "Package.resolved" -type f -delete
          
          # 2. حذف كاش الـ Swift Package Manager في بيئة Runner
          rm -rf ~/Library/Caches/org.swift.swiftpm/
          
          # 3. حذف مجلد التبعيات المحلي في المشروع إن وجد
          rm -rf .swiftpm/
          
          # 4. إعادة بناء الـ Workspace بدون الاعتماد على القفل القديم
          # هذا سيجبر Xcode على جلب التبعيات المتاحة في الريموت حسب تعريفاتها الحالية
          echo "Dependencies cleared."

      - name: Force Automatic Signing
        run: |
          PROJECT_FILE=$(find . -name "*.pbxproj" -print -quit)
          if [ -f "$PROJECT_FILE" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g' "$PROJECT_FILE"
            sed -i '' 's/DevelopmentTeam = "[^"]*";/DevelopmentTeam = "LH6K854ZP6";/g' "$PROJECT_FILE"
          fi

      - name: Build and Archive
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          # نستخدم -resolvePackageDependencies لإجبار Xcode على إعادة البحث
          xcodebuild -resolvePackageDependencies \
                     -workspace "$(basename "$WORKSPACE_PATH")" \
                     -scheme App
          
          xcodebuild -workspace "$(basename "$WORKSPACE_PATH")" \
                     -scheme App \
                     -configuration Release \
                     archive \
                     -archivePath $PWD/build/App.xcarchive \
                     -allowProvisioningUpdates \
                     -allowProvisioningDeviceRegistration \
                     DEVELOPMENT_TEAM="LH6K854ZP6" \
                     CODE_SIGN_STYLE=Automatic

      - name: Create exportOptions.plist
        run: |
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>LH6K854ZP6</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export IPA
        run: |
          WORKSPACE_PATH=$(find . -name "*.xcworkspace" -print -quit)
          xcodebuild -exportArchive \
                     -archivePath $PWD/build/App.xcarchive \
                     -exportPath $PWD/build/output \
                     -exportOptionsPlist exportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: 'ios/App/build/output/App.ipa'
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
